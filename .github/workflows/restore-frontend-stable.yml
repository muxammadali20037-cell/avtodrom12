name: Restore stable frontend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified stable frontend snapshot
        run: git checkout 35f71cb6d03d8d831d4c4a7ed81b134c08aad023 -- frontend/index.html

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('frontend/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          Path('/tmp/frontend-js-check.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          print(f'Checked {len(scripts)} inline script blocks')
          PY
          node --check /tmp/frontend-js-check.js

      - name: Commit restored frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html
          if git diff --cached --quiet; then
            echo 'frontend/index.html already matches stable snapshot'
            exit 0
          fi
          git commit -m 'fix: restore stable frontend without syntax mutation'
          git push origin HEAD:main
