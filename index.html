<!doctype html>
<html lang="uz">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVTODROM</title></head>
<body><div style="font-family:Arial;padding:40px;text-align:center">Yuklanmoqda...</div>
<script>
(async()=>{
  try{
    const r=await fetch('/index.backup.html',{cache:'no-store'});
    if(!r.ok) throw new Error('backup index yuklanmadi: '+r.status);
    let html=await r.text();
    html=html.replace("esc(s?.name'')","esc(s?.name||'')").replace("esc(g?.name'')","esc(g?.name||'')");
    const oldParse=html.match(/function parseBulk\(\)\{[\s\S]*?\nfunction previewBulk\(\)/);
    const fixedParse=`function parseBulk(){const lines=($('bulkText').value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),rows=[],errors=[];lines.forEach((line,i)=>{let m=line.match(/^(.+?)\s*(?:,|;|\t)\s*(\d{4}-\d{2}-\d{2}|\d{2}\.\d{2}\.\d{4})\s*(?:,|;|\t)\s*(\d+)$/);if(!m)m=line.match(/^(.+?)\s+(\d{4}-\d{2}-\d{2}|\d{2}\.\d{2}\.\d{4})\s+(\d+)$/);if(!m){errors.push((i+1)+'-qator: F.I.Sh., tug‘ilgan sana va dars sonini kiriting');return}let birthDate=m[2];if(/^\d{2}\.\d{2}\.\d{4}$/.test(birthDate)){const [d,mo,y]=birthDate.split('.');birthDate=y+'-'+mo+'-'+d}const lessons=Number(m[3]);if(!Number.isInteger(lessons)||lessons<0){errors.push((i+1)+'-qator: dars soni noto‘g‘ri');return}rows.push({line:i+1,fullName:m[1].trim(),birthDate,lessons})});return{rows,errors}}
function previewBulk()`;
    if(oldParse) html=html.replace(oldParse,fixedParse);
    const doc=new DOMParser().parseFromString(html,'text/html');
    const imported=document.importNode(doc.documentElement,true);
    document.documentElement.replaceWith(imported);
    const scripts=[...document.querySelectorAll('script')].filter(s=>s.textContent&&s.textContent.includes("'use strict'"));
    for(const old of scripts){const s=document.createElement('script');s.textContent=old.textContent;old.replaceWith(s)}
  }catch(e){document.body.innerHTML='<pre style="color:#b42318;padding:20px">'+String(e.message||e)+'</pre>'}
})();
</script>
</body></html>
