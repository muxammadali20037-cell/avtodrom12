<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087443">
<meta name="description" content="AVTODROM — professional boshqaruv tizimi">
<title>AVTODROM — Boshqaruv tizimi</title>
<style>
:root{--green:#087443;--green2:#0a8b51;--soft:#eaf8f1;--bg:#f5f8f6;--ink:#10221a;--muted:#728079;--line:#e1eae5;--danger:#b42318;--white:#fff;--shadow:0 8px 30px rgba(16,34,26,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,Arial,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}body{min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.avto-app,.avto-view{min-height:100vh}
/* LOGIN */
#loginView{display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0,#eefaf4 0,#f5f8f6 45%,#f5f8f6 100%)}#loginView .avto-box{width:min(430px,100%);margin:0;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 18px 60px rgba(16,34,26,.10)}#loginView .avto-box:before{content:"A";width:54px;height:54px;border-radius:16px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:900;margin-bottom:18px}#loginView h1{font-size:28px;margin:0 0 6px;letter-spacing:-.5px}#loginView p{margin:0 0 14px;color:var(--muted)}#loginView hr{border:0;border-top:1px solid var(--line);margin:22px 0}#loginView form{display:grid;gap:11px}#loginView input{height:46px}
/* APP */
#mainView header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 24px;position:fixed;left:225px;right:0;top:0;z-index:20}#mainView header>div:first-child{display:flex;align-items:center;gap:10px}#mainView header b{font-size:16px}#clock{color:var(--muted);font-size:13px}#logout{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:800;color:var(--ink)}#logout:hover{background:#fafcfb;border-color:#cbd9d1}
/* SIDEBAR */
#mainView nav{position:fixed;left:0;top:0;bottom:0;width:225px;background:#fff;border-right:1px solid var(--line);padding:82px 12px 18px;display:grid;align-content:start;gap:5px;z-index:25}#mainView nav:before{content:"AVTODROM\A BOSHQARUV TIZIMI";white-space:pre;position:absolute;top:19px;left:64px;line-height:17px;font-weight:900;font-size:14px;color:var(--ink)}#mainView nav:after{content:"A";position:absolute;top:18px;left:18px;width:36px;height:36px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}#mainView nav button{width:100%;border:0;background:transparent;text-align:left;padding:12px 11px;border-radius:10px;color:#56635d;font-weight:750;transition:.15s ease}#mainView nav button:hover{background:var(--soft);color:var(--green);transform:translateX(1px)}#mainView nav button:first-child{background:var(--soft);color:var(--green)}
/* CONTENT */
#mainView main{margin-left:225px;padding:92px 24px 30px;max-width:1600px}.avto-view h2{font-size:18px;margin:0 0 16px;color:var(--ink)}.avto-view p{color:var(--muted)}.avto-view form{display:grid;gap:12px}.avto-view label{display:grid;gap:6px;font-size:12px;font-weight:800;color:#52605a}.avto-view input,.avto-view select{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}.avto-view input:focus,.avto-view select:focus{border-color:#7eb59b;box-shadow:0 0 0 3px rgba(8,116,67,.08)}.avto-view button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:800;transition:.15s ease}.avto-view button:hover{transform:translateY(-1px)}.avto-view form>button{background:var(--green);border-color:var(--green);color:#fff}.avto-view form>button:hover{background:var(--green2)}
/* CARDS / TABLES */
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:15px 0}.cards>div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.cards b{display:block;color:var(--muted);font-size:12px}.cards strong{display:block;font-size:24px;line-height:1.1;margin-top:9px;letter-spacing:-.4px}.avto-view article{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin:8px 0;box-shadow:0 3px 16px rgba(16,34,26,.035);display:grid;grid-template-columns:1.2fr 1fr 1.4fr auto;gap:12px;align-items:center}.avto-view article>span,.avto-view article>small{color:var(--muted);font-size:12px}.avto-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.avto-view .form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 20px rgba(16,34,26,.04)}.table{display:grid;gap:7px;margin-top:15px}.table>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;display:grid;grid-template-columns:1fr 1.4fr .8fr 1.5fr 1fr 1.5fr;gap:10px;align-items:center;font-size:12px}.table>div span{color:var(--muted)}.live{font-variant-numeric:tabular-nums;color:var(--green)!important;font-weight:900!important}.avto-view details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin:8px 0}.avto-view summary{cursor:pointer;font-weight:800}.avto-view small{display:block;margin-top:6px}.avto-view #finishBox{margin-top:18px}.avto-view #startMsg,.avto-view #payMsg,.avto-view #schoolMsg,.avto-view #studentMsg,.avto-view #settingsMsg{margin-top:12px;padding:11px;border-radius:10px;background:var(--soft);color:var(--green);font-size:13px;font-weight:700}.avto-error{background:#fff0ef;color:var(--danger);border:1px solid #ffd3cf;border-radius:11px;padding:13px}.avto-view hr{border:0;border-top:1px solid var(--line);margin:20px 0}
/* MOBILE */
@media(max-width:1150px){.cards{grid-template-columns:repeat(3,1fr)}.table>div{grid-template-columns:1fr 1fr 1fr}.table>div span:nth-child(n+4){grid-column:auto}}@media(max-width:800px){#mainView header{left:72px;padding:0 12px}#mainView nav{width:72px;padding:82px 7px 15px}#mainView nav:before{content:"A";left:18px;top:18px;width:36px;height:36px;text-align:center;line-height:36px;background:var(--green);color:#fff;border-radius:11px;font-size:16px}#mainView nav:after{display:none}#mainView nav button{font-size:0;text-align:center;padding:12px 5px}#mainView nav button:first-letter{font-size:18px}#mainView main{margin-left:72px;padding:86px 14px 20px}.cards{grid-template-columns:repeat(2,1fr)}.avto-view article{grid-template-columns:1fr}.table>div{grid-template-columns:1fr}.table>div span{display:block}}@media(max-width:480px){#loginView{padding:14px}#loginView .avto-box{padding:23px;border-radius:20px}.cards{grid-template-columns:1fr}.cards strong{font-size:22px}#clock{display:none}}
</style>
</head>
<body>
<div id="avtodrom-root"></div>
<script type="module" src="./frontend/app.js"></script>
</body>
</html>
