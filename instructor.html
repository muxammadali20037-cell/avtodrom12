<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AVTODROM INSTRUKTOR</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f3f7f5;color:#09251b}button{border:0;font:inherit}.app{max-width:620px;margin:auto;padding:14px 12px 90px}.top{background:#08251b;color:#fff;border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px #0001}.brand{font-weight:900;font-size:17px}.logout{background:#fff;color:#071f16;border-radius:12px;padding:10px 15px;font-weight:800}.hero{margin-top:14px;background:linear-gradient(135deg,#0b5b3e,#12734e);color:#fff;border-radius:20px;padding:20px}.hero h1{margin:0 0 5px;font-size:25px}.muted{color:#71827b;font-size:13px}.hero .muted{color:#d4eee3}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.card{background:#fff;border:1px solid #e1e9e5;border-radius:18px;padding:15px;box-shadow:0 5px 18px #09251b08}.num{font-size:25px;font-weight:900;margin-top:7px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dfe8e4;display:flex;justify-content:center;z-index:5}.nav button{flex:1;max-width:155px;background:#fff;padding:12px 4px;color:#63756e;font-size:12px;font-weight:700}.nav button.active{color:#08734d}.section{margin-top:14px}.section h2{font-size:18px;margin:0 0 10px}.booking{margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:12px}.time{font-size:24px;font-weight:900}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eaf6f0;color:#08734d;font-size:11px;font-weight:800}.info{margin-top:10px;line-height:1.55}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;padding:12px;border-radius:12px;font-weight:900;background:#0b5b3e;color:#fff}.actions button.alt{background:#edf4f1;color:#0b5b3e}.empty{text-align:center;padding:25px;color:#778881}.error{background:#fff0f0;color:#a52b2b;padding:14px;border-radius:14px;margin-top:12px}.profileline{padding:8px 0;border-bottom:1px solid #edf1ef}.profileline:last-child{border:0}.hidden{display:none}.loader{padding:30px;text-align:center}.small{font-size:12px;color:#71827b}.refresh{float:right;background:#edf4f1;color:#0b5b3e;border-radius:10px;padding:7px 10px;font-weight:800}</style></head><body><main class="app"><header class="top"><div class="brand">🚘 AVTODROM INSTRUKTOR</div><button class="logout" onclick="closeApp()">Chiqish</button></header><div id="error"></div><section id="home"><div class="hero"><h1 id="name">Yuklanmoqda...</h1><div class="muted" id="verified">Telegram orqali xavfsiz kirish</div></div><div class="stats"><div class="card"><div class="muted">Bugungi bronlar</div><div class="num" id="sToday">—</div></div><div class="card"><div class="muted">Haftalik qabul</div><div class="num" id="sWeek">—</div></div><div class="card"><div class="muted">Oylik qabul</div><div class="num" id="sMonth">—</div></div><div class="card"><div class="muted">Yillik qabul</div><div class="num" id="sYear">—</div></div></div><section class="section"><h2>Bugungi bronlar <button class="refresh" onclick="loadAll()">↻</button></h2><div id="today"><div class="loader">Yuklanmoqda...</div></div></section></section><section id="bookings" class="hidden"><div class="section"><h2>Mening bronlarim</h2><div id="allBookings"></div></div></section><section id="stats" class="hidden"><div class="section"><h2>Statistikam</h2><div class="card"><div class="profileline">Bugun: <b id="xToday">—</b></div><div class="profileline">7 kun: <b id="xWeek">—</b></div><div class="profileline">30 kun: <b id="xMonth">—</b></div><div class="profileline">1 yil: <b id="xYear">—</b></div><div class="profileline">Qabul qilingan: <b id="xAccepted">—</b></div></div></div></section><section id="profile" class="hidden"><div class="section"><h2>Profil</h2><div class="card" id="profileBox">Yuklanmoqda...</div></div></section></main><nav class="nav"><button class="active" data-tab="home">🏠<br>Bosh sahifa</button><button data-tab="bookings">📅<br>Bronlarim</button><button data-tab="stats">📊<br>Statistika</button><button data-tab="profile">👤<br>Profil</button></nav><script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const initData=tg?.initData||''; const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(path,opt={}){const h={'Content-Type':'application/json','X-Telegram-Init-Data':initData};const r=await fetch(path,{...opt,headers:{...h,...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Server xatosi '+r.status);return d}
function err(e){$('#error').innerHTML='<div class="error">⚠️ '+esc(e.message||e)+'</div>'}
function dt(b){const raw=b.booking_date||b.start_at;let date=b.date||'—',time=b.time||'—';if(raw){const d=new Date(raw);if(!Number.isNaN(d.getTime())){date=d.toLocaleDateString('uz-UZ',{timeZone:'Asia/Tashkent'});time=d.toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tashkent'})}}return {date,time}}
function status(s){return ({pending:'Kutilmoqda',confirmed:'Tasdiqlangan',arrived:'Keldi',completed:'Tugagan',no_show:'Kelmagan',cancelled:'Bekor qilingan',rejected:'Rad etilgan'})[s]||s||'—'}
function bookingCard(b){const d=dt(b);const canArr=['confirmed','pending'].includes(String(b.status));const canLeave=String(b.status)==='arrived';return `<article class="card booking"><div class="row"><div><div class="time">${esc(d.time)}</div><div class="small">${esc(d.date)}</div></div><span class="badge">${esc(status(b.status))}</span></div><div class="info"><b>👤 ${esc(b.customer_name||'O‘quvchi')}</b><br>📞 ${esc(b.customer_phone||'—')}<br>🚘 ${esc(b.vehicle_plate||'Raqam kiritilmagan')} ${esc(b.vehicle_model||'')}<br>📚 ${esc(b.course_name||'Amaliy mashg‘ulot')} · ${esc(b.duration||b.course_duration||'—')} daqiqa</div>${b.customer_note?'<div class="small" style="margin-top:7px">💬 '+esc(b.customer_note)+'</div>':''}<div class="actions">${canArr?'<button onclick="change(\''+esc(b.id)+'\',\'arrived\')">✅ KELDI</button>':''}${canLeave?'<button class="alt" onclick="change(\''+esc(b.id)+'\',\'departed\')">🚪 KETDI</button>':''}</div></article>`}
async function loadMe(){const d=await api('/api/instructor/me');const i=d.instructor;$('#name').textContent=i.full_name||'Instruktor';$('#verified').textContent='✅ Admin tomonidan tasdiqlangan'+(i.vehicle?.plate?' · 🚘 '+i.vehicle.plate:'');$('#profileBox').innerHTML='<div class="profileline"><b>F.I.Sh.</b><br>'+esc(i.full_name)+'</div><div class="profileline"><b>Telefon</b><br>'+esc(i.phone||'—')+'</div><div class="profileline"><b>Tajriba</b><br>'+esc(i.experience_years||0)+' yil</div><div class="profileline"><b>Reyting</b><br>⭐ '+esc(i.rating||0)+' ('+esc(i.total_reviews||0)+' sharh)</div><div class="profileline"><b>Avtomobil</b><br>'+esc(i.vehicle?.plate||'—')+' '+esc(i.vehicle?.model||'')+'</div>'}
async function loadBookings(){const d=await api('/api/instructor/bookings');const rows=d.bookings||[];$('#allBookings').innerHTML=rows.length?rows.map(bookingCard).join(''):'<div class="card empty">Hozircha bronlar yo‘q.</div>';const today=rows.filter(b=>b.date===new Date().toISOString().slice(0,10));$('#today').innerHTML=today.length?today.map(bookingCard).join(''):(rows.length&&rows[0].date===new Date().toISOString().slice(0,10)?rows.map(bookingCard).join(''):'<div class="card empty">Bugun bron yo‘q.</div>')}
async function loadStats(){const d=await api('/api/instructor/statistics');const s=d.stats||{};['today','week','month','year'].forEach(k=>{$('#s'+k[0].toUpperCase()+k.slice(1)).textContent=s[k]??0;$('#x'+k[0].toUpperCase()+k.slice(1)).textContent=s[k]??0});$('#xAccepted').textContent=s.accepted??0}
async function change(id,action){try{await api('/api/instructor/bookings/'+encodeURIComponent(id)+'/status',{method:'PATCH',body:JSON.stringify({action})});await loadAll();}catch(e){err(e)}}
async function loadAll(){try{$('#error').innerHTML='';await Promise.all([loadMe(),loadBookings(),loadStats()])}catch(e){err(e)}}
function closeApp(){try{tg?.close()}catch{}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['home','bookings','stats','profile'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==b.dataset.tab))});
loadAll(); setInterval(loadAll,30000);
</script></body></html>
