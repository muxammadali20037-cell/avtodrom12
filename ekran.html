<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Darslar — katta ekran</title>
<meta name="robots" content="noindex">
<style>
/* =========================================================================
   KATTA EKRAN — hozir ketayotgan avtoshkola darslari (teskari sanoq)

   Instruktor Avtodrom ilovasida QR chekni skanerlashi bilan dars shu
   ekranda paydo bo'ladi va vaqt teskari sanaladi. Instruktor «Ketdi»
   bosganda dars ekrandan tushadi. Vaqt tugasa kartochka qizil bo'lib,
   ortiqcha vaqt «+» bilan sanaladi.

   Kirish: shu brauzerda Avtodrom 12 ga login qilingan bo'lishi kerak
   (kassa kompyuteriga ulangan ikkinchi monitor yoki televizor).
   ========================================================================= */
:root{
  --bg:#070b14;--card:#0f172a;--line:#1e293b;--text:#f1f5f9;--muted:#94a3b8;
  --ok:#22c55e;--soon:#f59e0b;--over:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
.hidden{display:none!important}
header{height:88px;display:flex;align-items:center;gap:24px;padding:0 32px;border-bottom:1px solid var(--line)}
.brand{font-weight:900;font-size:30px;letter-spacing:1px}
.brand small{display:block;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.count{margin-left:auto;font-size:22px;color:var(--muted)}
.count b{color:var(--text);font-size:28px}
.clock{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;min-width:170px;text-align:right}
.net{font-size:15px;color:#fca5a5;border:1px solid #7f1d1d;border-radius:999px;padding:4px 12px}
.fs{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer}

main{height:calc(100vh - 88px);padding:20px;display:grid;gap:18px;
  grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:calc(var(--fs)*.12) calc(var(--fs)*.16);
  display:flex;flex-direction:column;justify-content:space-between;min-height:0;overflow:hidden;position:relative}
.card .name{font-weight:800;font-size:calc(var(--fs)*.26);line-height:1.15;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .time{font-weight:900;font-size:var(--fs);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px;color:var(--ok);text-align:center}
.card .label{text-align:center;font-size:calc(var(--fs)*.16);font-weight:800;letter-spacing:2px;color:var(--muted);margin-top:4px}
.card .meta{font-size:calc(var(--fs)*.17);color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card .meta b{color:var(--text);font-weight:700}
.bar{height:calc(var(--fs)*.07);min-height:6px;background:#1e293b;border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}

.card.soon{border-color:var(--soon)}
.card.soon .time{color:var(--soon)}
.card.soon .bar i{background:var(--soon)}
.card.over{border-color:var(--over);background:#2a0d0f}
.card.over .time{color:#fff}
.card.over .label{color:#fecaca}
.card.over .bar i{background:var(--over)}
.card.over::after{content:"";position:absolute;inset:0;border-radius:20px;box-shadow:inset 0 0 0 4px var(--over);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.card.over::after{animation:none;opacity:.6}}

.empty{position:fixed;inset:88px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:20px}
.empty b{font-size:clamp(34px,5vw,72px);color:var(--text);font-weight:800}
.empty span{font-size:clamp(18px,2vw,28px);margin-top:12px}
.empty a{color:#93c5fd;font-size:clamp(18px,2vw,26px);margin-top:18px}
</style>
</head>
<body>
<header>
  <div class="brand">INDEX AVTODROM<small>Avtoshkola darslari — qolgan vaqt</small></div>
  <div class="count" id="count"></div>
  <span class="net hidden" id="net">Aloqa yo'q</span>
  <button class="fs" type="button" id="fs">To'liq ekran</button>
  <div class="clock" id="clock">--:--</div>
</header>
<main id="grid" aria-live="polite"></main>
<div class="empty hidden" id="empty"></div>

<script>
(function () {
  'use strict';
  var POLL_MS = 10000;
  var SOON_SEC = 5 * 60;          /* oxirgi 5 daqiqa — sariq */
  var TZ = 'Asia/Tashkent';
  var lessons = [], offset = 0, lastOk = 0, authFail = false;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (x) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[x]; }); }
  function token() { try { return localStorage.getItem('avtodrom_token') || ''; } catch (e) { return ''; } }
  /* Televizor soati noto'g'ri bo'lishi mumkin — server vaqtiga tenglashtiramiz */
  function now() { return Date.now() + offset; }
  function mmss(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    var p = function (n) { return String(n).padStart(2, '0'); };
    return h ? h + ':' + p(m) + ':' + p(s) : p(m) + ':' + p(s);
  }
  function hhmm(t) { return new Date(t).toLocaleTimeString('uz-UZ', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false }); }

  function showEmpty(title, text, link) {
    $('grid').innerHTML = '';
    var el = $('empty');
    el.innerHTML = '<b>' + esc(title) + '</b>' + (text ? '<span>' + esc(text) + '</span>' : '')
      + (link ? '<a href="' + link.href + '">' + esc(link.text) + '</a>' : '');
    el.classList.remove('hidden');
  }

  /* Kartochkalar soniga qarab ustun va shrift o'lchami */
  function layout(n) {
    var cols = n <= 1 ? 1 : n <= 4 ? 2 : n <= 9 ? 3 : n <= 16 ? 4 : 5;
    var rows = Math.max(1, Math.ceil(n / cols));
    var w = window.innerWidth / cols, h = (window.innerHeight - 88) / rows;
    var fs = Math.max(28, Math.min(w * 0.24, h * 0.30, 230));
    var g = $('grid');
    g.style.setProperty('--cols', cols);
    g.style.setProperty('--fs', fs + 'px');
  }

  function build() {
    if (authFail) return;
    $('count').innerHTML = lessons.length ? 'Hozir: <b>' + lessons.length + '</b> ta dars' : '';
    if (!lessons.length) { showEmpty('Hozir dars yo‘q', 'Instruktor QR chekni skanerlashi bilan dars shu yerda paydo bo‘ladi'); return; }
    $('empty').classList.add('hidden');
    layout(lessons.length);
    $('grid').innerHTML = lessons.map(function (x) {
      var meta = [x.instructor_name, x.vehicle_plate].filter(Boolean).join(' · ');
      var sub = [x.group_name ? x.group_name + '-guruh' : '', x.visit_index ? x.visit_index + '-kelishi' : ''].filter(Boolean).join(' · ');
      return '<section class="card" data-id="' + esc(x.id) + '">'
        + '<div class="name">' + esc(x.student_name || '—') + '</div>'
        + '<div><div class="time">--:--</div><div class="label">QOLDI</div><div class="bar"><i style="width:0%"></i></div></div>'
        + '<div class="meta"><span><b>' + esc(meta || 'Instruktor') + '</b></span><span>' + esc(sub) + '</span>'
        + '<span>' + esc(hhmm(x.scanned_at)) + ' — ' + esc(hhmm(x.ends_at)) + '</span></div>'
        + '</section>';
    }).join('');
    tick();
  }

  /* Har soniyada faqat raqamlar yangilanadi */
  function tick() {
    $('clock').textContent = new Date(now()).toLocaleTimeString('uz-UZ', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    var t = now();
    lessons.forEach(function (x) {
      var card = document.querySelector('.card[data-id="' + CSS.escape(String(x.id)) + '"]');
      if (!card) return;
      var total = x.planned_minutes * 60;
      var left = (new Date(x.ends_at).getTime() - t) / 1000;
      var over = left < 0;
      card.classList.toggle('over', over);
      card.classList.toggle('soon', !over && left <= SOON_SEC);
      card.querySelector('.time').textContent = over ? '+' + mmss(-left) : mmss(Math.ceil(left));
      card.querySelector('.label').textContent = over ? 'VAQT TUGADI' : 'QOLDI';
      var done = Math.min(100, Math.max(0, (total - Math.max(0, left)) / total * 100));
      card.querySelector('.bar i').style.width = done + '%';
    });
    $('net').classList.toggle('hidden', !lastOk || Date.now() - lastOk < 3 * POLL_MS);
    if (lastOk && Date.now() - lastOk >= 3 * POLL_MS) $('net').textContent = 'Aloqa yo‘q — ' + hhmm(lastOk + offset) + ' holati';
  }

  function load() {
    var tk = token();
    if (!tk) {
      authFail = true;
      showEmpty('Ekran ulanmagan', 'Shu brauzerda Avtodrom 12 ga login bilan kiring, keyin bu sahifani qayta oching', { href: '/', text: 'Avtodrom 12 ga kirish' });
      return;
    }
    fetch('/api/receipts/live', { headers: { Authorization: 'Bearer ' + tk }, cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) { var e = new Error('auth'); e.auth = true; throw e; }
        return r.json();
      })
      .then(function (d) {
        authFail = false;
        if (d && d.now) offset = new Date(d.now).getTime() - Date.now();
        var list = (d && d.lessons) || [];
        var changed = list.map(function (x) { return x.id + x.ends_at; }).join() !== lessons.map(function (x) { return x.id + x.ends_at; }).join();
        lessons = list;
        lastOk = Date.now();
        if (changed || !$('grid').children.length) build(); else tick();
      })
      .catch(function (e) {
        if (e && e.auth) {
          authFail = true;
          showEmpty('Kirish muddati tugagan', 'Shu brauzerda Avtodrom 12 ga qaytadan kiring', { href: '/', text: 'Avtodrom 12 ga kirish' });
        }
        /* Internet uzilsa oxirgi ro'yxat bilan sanashda davom etamiz */
      });
  }

  $('fs').addEventListener('click', function () {
    try { document.documentElement.requestFullscreen(); } catch (e) { /* noop */ }
  });
  document.addEventListener('fullscreenchange', function () { $('fs').classList.toggle('hidden', !!document.fullscreenElement); });
  window.addEventListener('resize', function () { if (lessons.length) layout(lessons.length); });
  /* Ekran o'chib qolmasin */
  function awake() { try { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(function () {}); } catch (e) { /* noop */ } }
  document.addEventListener('visibilitychange', awake);

  load(); awake();
  setInterval(load, POLL_MS);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
