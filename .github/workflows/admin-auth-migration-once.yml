name: admin-auth-migration-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'admin auth migration applied') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch frontend and admin API metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace("const ADMIN_LOGIN = 'admin';\nconst ADMIN_PASS = 'Admin@2026';\n", "")
          s=s.replace("let me = JSON.parse(localStorage.getItem('avtodrom_user') || 'null');", "let me = JSON.parse(localStorage.getItem('avtodrom_user') || 'null');\nlet adminToken = sessionStorage.getItem('avtodrom_admin_token') || '';")
          s=s.replace("function logout() { localStorage.removeItem('avtodrom_token'); localStorage.removeItem('avtodrom_user'); sessionStorage.removeItem('avtodrom_admin'); location.reload(); }", "function logout() { localStorage.removeItem('avtodrom_token'); localStorage.removeItem('avtodrom_user'); sessionStorage.removeItem('avtodrom_admin'); sessionStorage.removeItem('avtodrom_admin_token'); adminToken=''; location.reload(); }")
          if 'async function adminApi(' not in s:
            marker='/* ===== NAVBAT (QUEUE) ===== */'
            block='''/* ===== ADMIN API ===== */\nasync function adminApi(path,opt={}) {\n  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),15000);\n  try {\n    const headers={'Content-Type':'application/json',...(adminToken?{Authorization:'Bearer '+adminToken}:{}),...(opt.headers||{})};\n    const r=await fetch(API+'/admin'+path,{...opt,headers,signal:ctrl.signal});\n    const txt=await r.text(); let data={};\n    try{data=txt?JSON.parse(txt):{}}catch{data={error:txt||('Server xatosi: '+r.status)}}\n    if(!r.ok) throw Error(data.error||data.message||('Server xatosi: '+r.status));\n    return data;\n  } finally { clearTimeout(timer); }\n}\n\n'''
            if marker not in s: raise SystemExit('queue marker missing')
            s=s.replace(marker,block+marker,1)
          pattern=re.compile(r"\$\('adminLoginForm'\)\.addEventListener\('submit', async e => \{.*?\nfunction closeAdminPanel\(\) \{.*?\n\}",re.S)
          new='''$('adminLoginForm').addEventListener('submit', async e => {\n  e.preventDefault(); $('adminErr').textContent='';\n  const btn=e.target.querySelector('.btn'); btn?.classList.add('loading');\n  try {\n    const r=await fetch(API+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('adminUser').value.trim(),password:$('adminPass').value})});\n    const data=await r.json().catch(()=>({}));\n    if(!r.ok) throw Error(data.error||'Admin login ishlamadi');\n    if(data.admin?.role!=='admin'||!data.token) throw Error('Admin sessiyasi yaroqsiz');\n    adminToken=data.token; sessionStorage.setItem('avtodrom_admin_token',adminToken);\n    sessionStorage.setItem('avtodrom_admin','1'); closeAdminGate(); $('adminPanel').classList.remove('hidden'); await adminLoad();\n  } catch(x) { $('adminErr').textContent=x.message||'Admin login xatosi'; }\n  finally { btn?.classList.remove('loading'); }\n});\nfunction closeAdminPanel() { sessionStorage.removeItem('avtodrom_admin'); sessionStorage.removeItem('avtodrom_admin_token'); adminToken=''; $('adminPanel').classList.add('hidden'); }'''
          m=pattern.search(s)
          if not m: raise SystemExit('admin gate block missing')
          s=s[:m.start()]+new+s[m.end():]
          s=s.replace("async function adminLoad() {\n  try { schools=await api('/schools')||[]; } catch { schools=[]; }\n  try { groups=await api('/groups')||[]; } catch { groups=[]; }\n  try { students=await api('/students')||[]; } catch { students=[]; }", "async function adminLoad() {\n  if(!adminToken) throw Error('Admin sessiyasi mavjud emas');\n  try { schools=await adminApi('/schools')||[]; } catch { schools=[]; }\n  try { groups=await adminApi('/groups')||[]; } catch { groups=[]; }\n  try { students=await adminApi('/students')||[]; } catch { students=[]; }")
          for old,new2 in [
            ("api('/schools/'+encodeURIComponent(id)","adminApi('/schools/'+encodeURIComponent(id)"),
            ("api('/schools',{method:'POST'","adminApi('/schools',{method:'POST'"),
            ("api('/students/'+encodeURIComponent(sid)+'/history'","adminApi('/students/'+encodeURIComponent(sid)"),
            ("api('/students/'+encodeURIComponent(id)","adminApi('/students/'+encodeURIComponent(id)"),
            ("api('/students',{method:'POST'","adminApi('/students',{method:'POST'"),
          ]: s=s.replace(old,new2)
          p.write_text(s,encoding='utf-8')
          Path('docs/ADMIN_SETUP.md').write_text('''# Admin authentication setup\n\nSet these variables in Vercel Production: `JWT_SECRET`, `ADMIN_USERNAME`, `ADMIN_PASSWORD`.\nAdmin credentials must not be stored in `index.html`.\nThe frontend receives a short-lived admin JWT and sends it only to `/api/admin/*`.\n''',encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check api/admin-auth-v2.js
          node --check api/index.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/frontend.js').write_text('\n'.join(blocks),encoding='utf-8')
          print('script blocks:',len(blocks))
          PY
          node --check /tmp/frontend.js
      - name: Commit one-time result
        run: |
          rm -f .github/workflows/admin-auth-migration-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: admin auth migration applied [skip ci]'
          git push
