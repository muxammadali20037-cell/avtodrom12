<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVTODROM — Boshqaruv tizimi</title>

<style>
:root{
  --green:#087443;
  --green2:#0b8b52;
  --light:#eef8f3;
  --lighter:#f7fbf9;
  --border:#dcebe4;
  --text:#10231a;
  --muted:#718078;
  --white:#fff;
  --danger:#d83b3b;
  --shadow:0 8px 30px rgba(8,116,67,.08);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f5f9f7;
  color:var(--text);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= LOGIN ================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:
    radial-gradient(circle at top left,#dff6e9 0,transparent 35%),
    #f5faf7;
}

.login-card{
  width:430px;
  max-width:100%;
  background:white;
  border:1px solid var(--border);
  border-radius:24px;
  padding:36px;
  box-shadow:0 20px 60px rgba(8,116,67,.12);
}

.logo{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:30px;
}

.logo-icon{
  width:48px;
  height:48px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--green);
  color:white;
  font-size:22px;
  font-weight:800;
}

.logo-title{
  font-size:21px;
  font-weight:800;
}

.logo-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.login-card h1{
  margin:0 0 7px;
  font-size:27px;
}

.login-card p{
  color:var(--muted);
  margin:0 0 24px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

input,
select{
  width:100%;
  height:46px;
  border:1px solid var(--border);
  border-radius:11px;
  padding:0 13px;
  outline:none;
  background:white;
  color:var(--text);
}

input:focus,
select:focus{
  border-color:var(--green2);
  box-shadow:0 0 0 3px rgba(8,116,67,.08);
}

.btn{
  border:0;
  border-radius:11px;
  min-height:44px;
  padding:0 18px;
  font-weight:700;
}

.btn-green{
  background:var(--green);
  color:white;
}

.btn-green:hover{
  background:#06633a;
}

.btn-light{
  background:var(--light);
  color:var(--green);
}

.btn-danger{
  background:#fff0f0;
  color:var(--danger);
}

.full{
  width:100%;
}

.login-divider{
  height:1px;
  background:var(--border);
  margin:25px 0;
}

.error{
  color:var(--danger);
  font-size:13px;
  margin-top:10px;
}

/* ================= APP ================= */

#app{
  min-height:100vh;
  display:grid;
  grid-template-columns:235px 1fr;
}

.sidebar{
  background:white;
  border-right:1px solid var(--border);
  padding:22px 14px;
  position:fixed;
  width:235px;
  height:100vh;
  left:0;
  top:0;
}

.sidebar .logo{
  padding:5px 8px 25px;
  margin-bottom:10px;
}

.nav-title{
  color:#9aa69f;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  padding:15px 12px 8px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:12px 13px;
  border-radius:10px;
  color:#41534a;
  font-weight:650;
  margin-bottom:3px;
}

.nav-btn:hover{
  background:#f0f8f4;
  color:var(--green);
}

.nav-btn.active{
  background:#e5f6ee;
  color:var(--green);
}

.main{
  grid-column:2;
  min-width:0;
}

.topbar{
  height:74px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:10;
}

.top-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.page-title{
  font-size:20px;
  font-weight:800;
}

.clock{
  font-size:13px;
  color:var(--muted);
}

.user-box{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#dff4e9;
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.content{
  padding:28px;
  max-width:1500px;
  margin:auto;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.page-head h1{
  margin:0;
  font-size:27px;
}

.page-head p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

/* ================= CARDS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:19px;
  box-shadow:var(--shadow);
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  margin-bottom:10px;
}

.stat-value{
  font-size:25px;
  font-weight:800;
}

.stat.green .stat-value{
  color:var(--green);
}

/* ================= PANELS ================= */

.grid2{
  display:grid;
  grid-template-columns:1.4fr 1fr;
  gap:18px;
}

.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  box-shadow:var(--shadow);
}

.panel-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:17px;
}

.empty{
  color:var(--muted);
  padding:25px 0;
  text-align:center;
}

/* ================= TABLE ================= */

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  text-align:left;
  font-size:11px;
  color:var(--muted);
  padding:11px 9px;
  border-bottom:1px solid var(--border);
}

td{
  padding:13px 9px;
  border-bottom:1px solid #edf3f0;
  font-size:13px;
}

.badge{
  display:inline-flex;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}

.badge-green{
  background:#e4f7ed;
  color:var(--green);
}

.badge-orange{
  background:#fff5df;
  color:#a46c00;
}

/* ================= FORM ================= */

.form-panel{
  max-width:850px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.form-grid .full-row{
  grid-column:1/-1;
}

.plate-grid{
  display:grid;
  grid-template-columns:90px 70px 1fr 90px;
  gap:8px;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

/* ================= VEHICLE ================= */

.vehicle-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  border:1px solid var(--border);
  border-radius:13px;
  padding:15px;
  margin-bottom:10px;
  background:#fff;
}

.vehicle-info{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.plate{
  font-size:17px;
  font-weight:800;
}

.muted{
  color:var(--muted);
  font-size:12px;
}

.timer{
  font-weight:800;
  color:var(--green);
  font-size:17px;
}

/* ================= FINISH ================= */

.finish-box{
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  margin-top:15px;
  background:#fbfefc;
}

.payment-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.amount-box{
  font-size:25px;
  font-weight:800;
  color:var(--green);
}

/* ================= HISTORY ================= */

.search-row{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.history-item{
  border:1px solid var(--border);
  border-radius:13px;
  margin-bottom:10px;
  background:white;
  overflow:hidden;
}

.history-head{
  padding:15px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

.history-detail{
  display:none;
  border-top:1px solid var(--border);
  padding:16px;
  background:#fbfdfc;
}

.history-item.open .history-detail{
  display:block;
}

/* ================= MOBILE ================= */

.mobile-menu{
  display:none;
  border:0;
  background:var(--light);
  color:var(--green);
  width:40px;
  height:40px;
  border-radius:10px;
}

@media(max-width:1000px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .grid2{
    grid-template-columns:1fr;
  }
}

@media(max-width:720px){
  #app{
    display:block;
  }

  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
    z-index:30;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    width:100%;
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 15px;
  }

  .content{
    padding:18px 14px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .plate-grid{
    grid-template-columns:70px 60px 1fr 70px;
  }

  .payment-grid{
    grid-template-columns:1fr;
  }

  .page-head{
    align-items:flex-start;
  }

  .user-box .btn{
    display:none;
  }
}

@media(max-width:480px){
  .stats{
    grid-template-columns:1fr;
  }

  .login-card{
    padding:25px;
  }

  .search-row{
    flex-direction:column;
  }

  .vehicle-card{
    flex-direction:column;
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginScreen">

      <div>

<section id="app" class="hidden">

  <aside class="sidebar" id="sidebar">

               id="pageTitle">

               id="clock">

             id="avatar">

<script>
/* =========================================================
   AVTODROM FRONTEND
   ========================================================= */

const API = "/api";

const regions = [
  "01","10","20","25","30","40",
  "50","60","70","75","80","85","90","95"
];

let currentPage = "dashboard";


/* ================= API ================= */

async function request(path, options = {}){

  const token =
    localStorage.getItem("avtodrom_token");

  const headers = {
    "Content-Type":"application/json",
    ...(options.headers || {})
  };

  if(token){
    headers.Authorization =
      "Bearer " + token;
  }

  const response = await fetch(
    API + path,
    {
      ...options,
      headers
    }
  );

  const data =
    await response.json()
      .catch(()=>({}));

  if(!response.ok){

    if(response.status === 401){

      logout();
    }

    throw new Error(
      data.error ||
      data.message ||
      "Server xatosi"
    );
  }

  return data;
}


/* ================= HELPERS ================= */

function money(value){

  return new Intl.NumberFormat(
    "uz-UZ"
  ).format(
    Number(value || 0)
  ) + " so‘m";
}


function time(value){

  if(!value) return "-";

  return new Date(value)
    .toLocaleTimeString(
      "uz-UZ",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
}


function dateTime(value){

  if(!value) return "-";

  return new Date(value)
    .toLocaleString("uz-UZ");
}


function duration(seconds){

  seconds =
    Math.max(
      0,
      Number(seconds || 0)
    );

  const h =
    Math.floor(seconds / 3600);

  const m =
    Math.floor(
      (seconds % 3600) / 60
    );

  const s =
    seconds % 60;

  return [
    String(h).padStart(2,"0"),
    String(m).padStart(2,"0"),
    String(s).padStart(2,"0")
  ].join(":");
}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function today(){

  return new Date()
    .toISOString()
    .slice(0,10);
}


/* ================= AUTH ================= */

document
.getElementById("loginForm")
.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    try{

      const data =
        await request(
          "/auth/login",
          {
            method:"POST",
            body:JSON.stringify({
              username:
                document
                .getElementById(
                  "loginUsername"
                ).value.trim(),

              password:
                document
                .getElementById(
                  "loginPassword"
                ).value
            })
          }
        );

      localStorage.setItem(
        "avtodrom_token",
        data.token
      );

      localStorage.setItem(
        "avtodrom_user",
        JSON.stringify(
          data.user || {}
        )
      );

      showApp();

    }catch(error){

      document
      .getElementById("loginError")
      .textContent =
        error.message;

    }

  }
);


document
.getElementById("registerForm")
.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    try{

      const data =
        await request(
          "/auth/register",
          {
            method:"POST",
            body:JSON.stringify({

              fullName:
                document
                .getElementById(
                  "regName"
                ).value.trim(),

              username:
                document
                .getElementById(
                  "regUsername"
                ).value.trim(),

              password:
                document
                .getElementById(
                  "regPassword"
                ).value

            })
          }
        );

      localStorage.setItem(
        "avtodrom_token",
        data.token
      );

      localStorage.setItem(
        "avtodrom_user",
        JSON.stringify(
          data.user || {}
        )
      );

      showApp();

    }catch(error){

      document
      .getElementById(
        "registerError"
      )
      .textContent =
        error.message;

    }

  }
);


document
.getElementById("showRegister")
.onclick = () => {

  document
  .getElementById("loginBox")
  .classList.add("hidden");

  document
  .getElementById("registerBox")
  .classList.remove("hidden");

};


document
.getElementById("showLogin")
.onclick = () => {

  document
  .getElementById("registerBox")
  .classList.add("hidden");

  document
  .getElementById("loginBox")
  .classList.remove("hidden");

};


function logout(){

  localStorage.removeItem(
    "avtodrom_token"
  );

  localStorage.removeItem(
    "avtodrom_user"
  );

  location.reload();
}


document
.getElementById("logout")
.onclick = logout;


/* ================= APP ================= */

function showApp(){

  document
  .getElementById("loginScreen")
  .classList.add("hidden");

  document
  .getElementById("app")
  .classList.remove("hidden");

  const user =
    JSON.parse(
      localStorage.getItem(
        "avtodrom_user"
      ) || "{}"
    );

  const name =
    user.fullName ||
    user.full_name ||
    user.username ||
    "Operator";

  document
  .getElementById("userName")
  .textContent =
    name;

  document
  .getElementById("avatar")
  .textContent =
    name
    .charAt(0)
    .toUpperCase();

  loadPage("dashboard");
}


/* ================= NAV ================= */

document
.querySelectorAll(".nav-btn")
.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      document
      .querySelectorAll(
        ".nav-btn"
      )
      .forEach(x =>
        x.classList.remove(
          "active"
        )
      );

      button.classList.add(
        "active"
      );

      loadPage(
        button.dataset.page
      );

      document
      .getElementById(
        "sidebar"
      )
      .classList.remove(
        "open"
      );

    }
  );

});


document
.getElementById("mobileMenu")
.onclick = () => {

  document
  .getElementById("sidebar")
  .classList.toggle("open");

};


/* ================= PAGE ================= */

async function loadPage(page){

  currentPage = page;

  const titles = {

    dashboard:"Dashboard",

    new:"Yangi avtomobil",

    active:"Jarayonda",

    finish:"Tugatish",

    reports:"Kunlik hisobot",

    history:"Avtomobil tarixi",

    schools:"Avtoshkolalar",

    students:"O‘quvchilar",

    settings:"Sozlamalar"

  };

  document
  .getElementById("pageTitle")
  .textContent =
    titles[page] || "AVTODROM";

  const content =
    document.getElementById(
      "content"
    );

  content.innerHTML =
    `<div class="panel">
      Yuklanmoqda...
    </div>`;

  try{

    if(page==="dashboard")
      await dashboardPage();

    if(page==="new")
      await newVehiclePage();

    if(page==="active")
      await activePage();

    if(page==="finish")
      await finishPage();

    if(page==="reports")
      await reportsPage();

    if(page==="history")
      await historyPage();

    if(page==="schools")
      await schoolsPage();

    if(page==="students")
      await studentsPage();

    if(page==="settings")
      await settingsPage();

window.finishFree =
async function(id){

  try{

    await request(
      "/sessions/" +
      id +
      "/finish",
      {
        method:"POST",
        body:JSON.stringify({
          amount:0,
          paymentMethod:"cash",
          cashAmount:0,
          terminalAmount:0
        })
      }
    );

    loadPage("dashboard");

  }catch(error){

    document
    .getElementById(
      "finishError"
    ).textContent =
      error.message;

  }

};


window.finishPaid =
async function(id){

  const amount =
    Number(
      document
      .getElementById(
        "finalAmount"
      ).value || 0
    );

  const method =
    document
    .getElementById(
      "paymentMethod"
    ).value;

  let cash =
    Number(
      document
      .getElementById(
        "cashAmount"
      ).value || 0
    );

  let terminal =
    Number(
      document
      .getElementById(
        "terminalAmount"
      ).value || 0
    );

  if(amount <= 0){

    document
    .getElementById(
      "finishError"
    ).textContent =
      "Yakuniy narxni kiriting.";

    return;

  }

  if(method==="cash"){

    cash = amount;
    terminal = 0;

  }

  if(method==="terminal"){

    terminal = amount;
    cash = 0;

  }

  if(method==="mixed" &&
     cash + terminal !== amount){

    document
    .getElementById(
      "finishError"
    ).textContent =
      "Naqd + Terminal summasi yakuniy narxga teng bo‘lishi kerak.";

    return;

  }

  try{

    await request(
      "/sessions/" +
      id +
      "/finish",
      {
        method:"POST",
        body:JSON.stringify({

          amount,

          paymentMethod:
            method,

          cashAmount:
            cash,

          terminalAmount:
            terminal

        })
      }
    );

    loadPage("dashboard");

  }catch(error){

    document
    .getElementById(
      "finishError"
    ).textContent =
      error.message;

  }

};

  const data =
    window.currentReport;

  if(!data) return;

  const rows =
    data.rows || [];

  const header = [
    "Raqam",
    "Model",
    "Haydovchi",
    "Kirish",
    "Chiqish",
    "Davomiylik",
    "Avtoshkola",
    "Guruh",
    "O‘quvchi",
    "Umumiy",
    "Naqd",
    "Terminal",
    "To‘lov turi"
  ];

  const output =
    [header]
    .concat(
      rows.map(
        row => [

          row.plate || "",
          row.model || "",
          row.driver_name || "",
          dateTime(
            row.started_at
          ),
          dateTime(
            row.finished_at
          ),
          duration(
            row.duration_seconds
          ),
          row.school_name || "",
          row.group_name || "",
          row.student_name || "",
          row.amount || 0,
          row.cash_amount || 0,
          row.terminal_amount || 0,
          row.payment_method || ""

        ]
      )
    )
    .map(
      row =>
        row.map(
          value =>
            `"${String(value)
              .replace(
                /"/g,
                '""'
              )}"`
        ).join(";")
    )
    .join("\n");

  const blob =
    new Blob(
      ["\ufeff" + output],
      {
        type:
          "text/csv;charset=utf-8"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement(
      "a"
    );

  a.href = url;

  a.download =
    "avtodrom-" +
    today() +
    ".csv";

  a.click();

  URL.revokeObjectURL(
    url
  );

};

          <div
            class="history-item"

              <div>

                <strong>
                  ${index + 1}.
                  ${dateTime(
                    row.started_at
                  )}

                <b>Kirish:</b>
                ${dateTime(
                  row.started_at
                )}
              </p>

              <p>
                <b>Chiqish:</b>
                ${dateTime(
                  row.finished_at
                )}
              </p>

              <p>
                <b>Davomiylik:</b>
                ${duration(
                  row.duration_seconds
                )}
              </p>

              <p>
                <b>Naqd:</b>
                ${money(
                  row.cash_amount
                )}
              </p>

              <p>
                <b>Terminal:</b>

                  row.terminal_amount

      `;

    }catch(error){

      result.innerHTML =

                student.full_name
              )}

        O‘quvchilar topilmadi

    ).textContent =
      error.message;

/* ================= CLOCK ================= */

function updateClock(){

  document
  .getElementById(
    "clock"
  )
  .textContent =
    new Date()
    .toLocaleString(
      "uz-UZ"
    );

}


function updateTimers(){

  document
  .querySelectorAll(
    "[data-start]"
  )
  .forEach(
    element => {

      const start =
        new Date(
          element.dataset.start
        ).getTime();

      const seconds =
        Math.floor(
          (
            Date.now() -
            start
          ) / 1000
        );

      element.textContent =
        duration(seconds);

    }
  );

}


setInterval(
  updateClock,
  1000
);

setInterval(
  updateTimers,
  1000
);

  updateClock();

  const token =

  try{

    await request(
      "/dashboard"
    );

    showApp();

  }catch{

    localStorage.removeItem(
      "avtodrom_token"
    );

    localStorage.removeItem(
      "avtodrom_user"
    );

  }

})();
