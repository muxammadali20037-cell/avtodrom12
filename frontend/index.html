<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avtodrom Management</title><style>:root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.avto-app,.avto-view{min-height:100vh}.avto-box{width:min(430px,92%);margin:8vh auto;padding:28px;background:white;border:1px solid #e4e8ef;border-radius:18px;box-shadow:0 12px 35px #0000000d}.avto-box h1{margin-top:0}.avto-box form{display:grid;gap:10px}.avto-box input,.form input,.form select{padding:12px;border:1px solid #d9dee8;border-radius:10px;font:inherit}.avto-box button,.form button{padding:12px;border:0;border-radius:10px;background:#166534;color:white;font-weight:700;cursor:pointer}header{height:68px;background:#fff;border-bottom:1px solid #e4e8ef;padding:0 24px;display:flex;align-items:center;justify-content:space-between}header div{display:flex;gap:18px;align-items:center}header button{border:1px solid #d9dee8;background:#fff;border-radius:9px;padding:9px 13px}nav{display:flex;gap:8px;padding:12px 24px;background:#fff;border-bottom:1px solid #e4e8ef;overflow:auto}nav button{border:0;background:#f1f4f8;padding:10px 14px;border-radius:9px;white-space:nowrap;cursor:pointer}main{max-width:1100px;margin:0 auto;padding:25px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.cards>div,.result,.finishCar,article,.table>div{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:18px}.cards b{display:block;color:#697386;font-size:13px}.cards strong{display:block;font-size:25px;margin-top:8px}.form{max-width:600px;display:grid;gap:13px;background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:20px}.form label{display:grid;gap:6px;font-weight:600}.form button{width:max-content}.table{display:grid;gap:8px;margin-top:18px}.table>div{display:grid;grid-template-columns:1.5fr 2fr 1fr 1fr;gap:10px}.finishCar,article{width:100%;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:10px;text-align:left;cursor:pointer;font:inherit}.finishCar:hover{border-color:#166534}.live{font-variant-numeric:tabular-nums;font-weight:700}.avto-error{padding:15px;background:#fff1f1;color:#a40000;border-radius:10px}hr{border:0;border-top:1px solid #eee;margin:22px 0}#authMsg,#startMsg,#settingsMsg{margin-top:12px}</style></head><body><div id="avtodrom-root"></div><script>window.AVTODROM_API='/api';</script><script type="module" src="./app.js"></script></body></html>
