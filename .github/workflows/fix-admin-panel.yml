name: Fix admin/operator panels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Operator panel: Admin panel tugmasini butunlay olib tashlash.
          old = '<div class="adminNav"><button class="nav" onclick="openAdminGate()">🔐 &nbsp; Admin panel</button></div>'
          s = s.replace(old, '')

          # 2) Admin login formasida login/parolni oldindan ko‘rsatmaslik.
          s = s.replace('<input id="adminUser" value="admin" autocomplete="username" required>', '<input id="adminUser" autocomplete="username" required>')
          s = s.replace('<input id="adminPass" type="password" autocomplete="current-password" placeholder="Admin@2026" required>', '<input id="adminPass" type="password" autocomplete="current-password" required>')

          # 3) Admin panelga faqat maxsus URL orqali kirish.
          old_fn = '''function openAdminGate(){
  if(sessionStorage.getItem('avtodrom_admin')==='1'){
    $('adminPanel').classList.remove('hidden');
    adminLoad();
    return;
  }
  $('adminUser').value=ADMIN_LOGIN;
  $('adminPass').value='';
  $('adminGate').classList.remove('hidden');
  $('adminErr').textContent='';
}'''
          new_fn = '''function openAdminGate(){
  const isAdminRoute = new URLSearchParams(location.search).get('panel') === 'admin';
  if(!isAdminRoute) return;
  if(sessionStorage.getItem('avtodrom_admin')==='1'){
    $('adminPanel').classList.remove('hidden');
    adminLoad();
    return;
  }
  $('adminUser').value='';
  $('adminPass').value='';
  $('adminGate').classList.remove('hidden');
  $('adminErr').textContent='';
}'''
          if old_fn in s:
              s = s.replace(old_fn, new_fn)

          # 4) Operator panel oddiy holatda qoladi; ?panel=admin bo‘lsa admin login oynasi ochiladi.
          marker = "const ADMIN_LOGIN='admin';\nconst ADMIN_PASSWORD='Admin@2026';"
          if marker in s and 'const ADMIN_ROUTE' not in s:
              s = s.replace(marker, marker + "\nconst ADMIN_ROUTE = new URLSearchParams(location.search).get('panel') === 'admin';")

          old_boot = "$('region').innerHTML=regions.map(x=>'<option>'+x+'</option>').join('');\nif(token&&me)boot();"
          new_boot = "$('region').innerHTML=regions.map(x=>'<option>'+x+'</option>').join('');\nif(token&&me){boot(); if(ADMIN_ROUTE) setTimeout(openAdminGate,80);}" 
          if old_boot in s:
              s = s.replace(old_boot, new_boot)

          # Marker: workflow keyingi pushlarda yana o‘zgartirmasin.
          if '<!-- ADMIN_OPERATOR_SPLIT_V2 -->' not in s:
              s = s.replace('</head>', '<!-- ADMIN_OPERATOR_SPLIT_V2 -->\n</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: separate admin and operator panels"
          git push
